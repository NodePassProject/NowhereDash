services:
  # Nowhere 应用 - 使用GitHub发布的镜像
  nowheredash:
    image: ghcr.io/nodepassproject/nowheredash:latest
    container_name: nowheredash
    # network_mode: "host" # 如需要ipv6，可考虑使用host模式
    ports:
      - "4000:4000"  # Web UI + API (single port)
    # environment:
    #   - PORT=4000
    #   - LOG-LEVEL=INFO
    #   - TLS_CERT=/path/to/cert.pem
    #   - TLS_KEY=/path/to/key.pem
    #   - DISABLE_LOGIN=true
    volumes:
      - /etc/localtime:/etc/localtime:ro 
      # TLS certificates
      # - /path/to/cert.pem:/path/to/cert.pem
      # - /path/to/key.pem:/path/to/key.pem
      # Persist data
      - ./db:/app/db
      # Persist file logs (optional but recommended)
      - ./logs:/app/logs
    restart: unless-stopped  # 自动更新依赖此 restart 策略：进程退出后由 Docker 自动拉起新版本
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
